  position: fixed;
  inset: 0;
  z-index: 9999;

#xtpDebugToggle,

}

#xtpDebugPane {
  display: none;

  z-index: 10013;
  right: 7px;
  top: calc(env(safe-area-inset-top,0px) + 47px);
  width: min(94vw,440px);
  max-height: 72dvh;
  overflow: auto;
  padding: 11px;

  color: #e1fff9;
  background: #071d20;
  border: 1px solid #56d9c1;

}

#xtpDebugPane .debug-actions {

#xtpDebugPane button {

#xtpDebugPane pre {

</style>

<script>
(() => {
'use strict';

const VERSION = '13.12';
const BOOT_ID = Date.now().toString(36);
const BASE = new URL('./', location.href);

const ASSETS = [
  'index.html',
  'app.js',
  'app.css'
];

const HARD_MODE = new URL(
  location.href
).searchParams.has('xtp_hard');

const logs = [];
const fingerprints = new Map();
const playerStates = new WeakMap();

let expanded = false;
let didStart = false;
let pendingUpdate = false;
let checking = null;
let lastCheck = 0;
let seenHidden = false;
let resetting = false;
let reloading = false;
let previous = '';

try {
  previous =
    sessionStorage.getItem(
      'xtp_debug_previous'
    ) || '';
} catch {}

/* ============================
   DEBUG LOG
============================ */

function log(event, detail = '') {
  const msg =
    new Date().toLocaleTimeString(
      'vi-VN',
      { hour12: false }
    ) +
    ' ' +
    event +
    (
      detail
        ? ' ' + String(detail)
        : ''
    );

  logs.push(msg);

  if (logs.length > 90) {
    logs.shift();
  }

  if (expanded) {
    renderDebug();
  }
}

/* ============================
   FRESH MEDIA AFTER RESET
============================ */

/*
  Sau Hard Reset, app.js gán
  video.src sẽ tự nhận URL mới.

  Việc này tránh lấy lại response
  MP4 có cùng URL từ HTTP cache.
*/

if (HARD_MODE) {
  const descriptor =
    Object.getOwnPropertyDescriptor(
      HTMLMediaElement.prototype,
      'src'
    );

  if (
    descriptor?.configurable &&
    descriptor.set &&
    descriptor.get
  ) {
    Object.defineProperty(
      HTMLMediaElement.prototype,
      'src',
      {
        configurable: true,
        enumerable: descriptor.enumerable,

        get() {
          return descriptor.get.call(this);
        },

        set(value) {
          let actual = value;

          try {
            const url = new URL(
              String(value),
              document.baseURI
            );

            if (
              url.protocol === 'https:' &&
              url.pathname.startsWith(
                '/media/'
              )
            ) {
              url.searchParams.set(
                'xtp_fresh',
                BOOT_ID
              );

              actual = url.href;
            }
          } catch {}

          return descriptor.set.call(
            this,
            actual
          );
        }
      }
    );

    log(
      'HARD MEDIA',
      'fresh URL enabled'
    );
  }

  /*
    app.js cũ tự đăng ký lại SW.
    Trong phiên Hard Reset,
    chặn đăng ký lại nếu có thể.
  */

  if ('serviceWorker' in navigator) {
    try {
      Object.defineProperty(
        navigator.serviceWorker,
        'register',
        {
          configurable: true,

          value: () => Promise.reject(
            new Error(
              'SW disabled in HARD RESET session'
            )
          )
        }
      );

      log(
        'HARD SW',
        'registration blocked'
      );

    } catch (error) {
      log(
        'HARD SW',
        'cannot block: ' + error.message
      );
    }
  }
}

/* ============================
   BUTTONS
============================ */

const toggle =
  document.createElement('button');

toggle.id = 'xtpDebugToggle';
toggle.type = 'button';
toggle.textContent = 'DBG 13.12';

const reset =
  document.createElement('button');

reset.id = 'xtpHardReset';
reset.type = 'button';
reset.textContent = 'HARD RESET';

reset.title =
  'Dọn cache app và khởi động sạch. ' +
  'Giữ reel đã lưu và follow.';

const panel =
  document.createElement('div');

panel.id = 'xtpDebugPane';

const buttons =
  document.createElement('div');

buttons.className = 'debug-actions';

const close =
  document.createElement('button');

close.type = 'button';
close.textContent = 'Đóng';

const copy =
  document.createElement('button');

copy.type = 'button';
copy.textContent = 'Copy log';

const reload =
  document.createElement('button');

reload.type = 'button';
reload.textContent = 'Tải lại trang';

const pre =
  document.createElement('pre');

buttons.append(
  close,
  copy,
  reload
);

panel.append(
  buttons,
  pre
);

document.body.append(
  reset,
  toggle,
  panel
);

/* ============================
   VIDEO STATE
============================ */

function videos() {
  return [
    ...document.querySelectorAll('video')
  ];
}

function stateString(video, index) {
  const parent = video.closest(
    '.reel-panel'
  );

  const state =
    playerStates.get(video) || {};

  let buffered = '-';

  try {
    if (video.buffered.length) {
      buffered =
        video.buffered.start(0).toFixed(1) +
        '-' +
        video.buffered.end(
          video.buffered.length - 1
        ).toFixed(1);
    }
  } catch {}

  return (
    `[${index}] ` +
    `key=${parent?.dataset.key || '?'} ` +
    `panel=${parent?.style.transform || '?'}\n` +

    `paused=${video.paused} ` +
    `ready=${video.readyState} ` +
    `network=${video.networkState}\n` +

    `time=${video.currentTime.toFixed(2)} ` +
    `duration=${
      Number.isFinite(video.duration)
        ? video.duration.toFixed(2)
        : '?'
    }\n` +

    `advance=${
      (state.advance || 0).toFixed(2)
    }s/1s ` +

    `stuck=${state.stuck || 0}s\n` +

    `buffered=${buffered} ` +
    `error=${video.error?.code ?? '-'}\n` +

    `src=${
      video.currentSrc ||
      video.getAttribute('src') ||
      '-'
    }`
  );
}

function snapshot() {
  return (
    `XTP JP ${VERSION} boot=${BOOT_ID}\n` +

    `mode=${
      matchMedia(
        '(display-mode:standalone)'
      ).matches
        ? 'PWA'
        : 'Browser'
    }\n` +

    `hardMode=${HARD_MODE} ` +
    `online=${navigator.onLine} ` +
    `visibility=${document.visibilityState}\n` +

    `SW=${
      navigator.serviceWorker
        ?.controller?.scriptURL || 'none'
    }\n` +

    `updates=${
      pendingUpdate ? 'pending' : 'current'
    } ` +

    `videoCount=${videos().length}\n\n` +

    videos()
      .map(stateString)
      .join('\n\n') +

    '\n\n--- LOG ---\n' +

    (
      previous
        ? 'PREVIOUS SESSION:\n' +
          previous +
          '\n------------\n'
        : ''
    ) +

    logs.join('\n')
  );
}

function renderDebug() {
  if (expanded) {
    pre.textContent = snapshot();
  }
}

function openDebug() {
  expanded = true;
  panel.style.display = 'block';
  renderDebug();
}

function hideDebug() {
  expanded = false;
  panel.style.display = 'none';
}

function saveLog() {
  try {
    sessionStorage.setItem(
      'xtp_debug_previous',
      logs.slice(-22).join('\n')
    );
  } catch {}
}

function reloadPage(reason) {
  if (reloading || resetting) {
    return;
  }

  reloading = true;

  log('RELOAD', reason);
  saveLog();

  const url = new URL(
    location.href
  );

  url.searchParams.set(
    'xtp_reload',
    Date.now().toString(36)
  );

  location.replace(url.href);
}

/* ============================
   HARD RESET
============================ */

async function hardReset() {
  if (resetting) {
    return;
  }

  resetting = true;

  reset.disabled = true;
  reset.textContent = 'ĐANG RESET...';

  log(
    'HARD RESET',
    'begin'
  );

  /*
    URL mới được chuẩn bị trước.
    Nếu thao tác dọn cache bị kẹt,
    sau 6.5 giây vẫn tải lại trang.
  */

  const cleanURL = new URL(
    BASE.href
  );

  cleanURL.searchParams.set(
    'xtp_hard',
    Date.now().toString(36)
  );

  const watchdog = setTimeout(
    () => {
      location.replace(
        cleanURL.href
      );
    },
    6500
  );

  /*
    HIỆN MÀN HÌNH RESET
  */

  const splash =
    document.getElementById(
      'xtpBoot'
    );

  if (splash) {
    splash.style.display = 'flex';
    splash.style.opacity = '1';
    splash.style.pointerEvents = 'auto';

    const status =
      splash.querySelector(
        '.boot-status'
      );

    if (status) {
      status.textContent =
        'Đang dọn cache, giải phóng video ' +
        'và tải mới…';
    }
  }

  /*
    BƯỚC 1:
    THÁO TOÀN BỘ VIDEO CŨ
  */

  for (const video of videos()) {
    try {
      video.pause();

      video.removeAttribute(
        'src'
      );

      video.querySelectorAll(
        'source'
      ).forEach(source => {
        source.removeAttribute(
          'src'
        );
      });

      video.load();

    } catch (error) {
      log(
        'VIDEO CLEANUP',
        error.message
      );
    }
  }

  /*
    BƯỚC 2:
    HỦY SERVICE WORKER XTP JP
  */

  if ('serviceWorker' in navigator) {
    try {
      const registrations =
        await navigator.serviceWorker
          .getRegistrations();

      const selected =
        registrations.filter(reg => (
          reg.scope === BASE.href ||
          reg.scope.startsWith(
            BASE.href
          )
        ));

      await Promise.allSettled(
        selected.map(reg =>
          reg.unregister()
        )
      );

      log(
        'SW UNREGISTER',
        selected.length +
        ' registration(s)'
      );

    } catch (error) {
      log(
        'SW UNREGISTER ERROR',
        error.message
      );
    }
  }

  /*
    BƯỚC 3:
    XÓA CACHE STORAGE XTP JP

    Không xóa cache của repo khác
    cùng GitHub Pages domain.
  */

  if ('caches' in window) {
    try {
      const names =
        await caches.keys();

      const owned =
        names.filter(name => (
          name.startsWith(
            'xtp-jp-'
          ) ||
          /^xtp.*(?:shell|cache)/i.test(
            name
          )
        ));

      await Promise.allSettled(
        owned.map(name =>
          caches.delete(name)
        )
      );

      log(
        'CACHE DELETE',
        owned.join(', ') || 'none'
      );

    } catch (error) {
      log(
        'CACHE ERROR',
        error.message
      );
    }
  }

  /*
    BƯỚC 4:
    XÓA TRẠNG THÁI PHIÊN TẠM

    KHÔNG XÓA localStorage:
    Saved và Follow vẫn được giữ.
  */

  try {
    for (
      const key of
      Object.keys(sessionStorage)
    ) {
      if (/^xtp[_-]/i.test(key)) {
        sessionStorage.removeItem(
          key
        );
      }
    }
  } catch {}

  /*
    BƯỚC 5:
    KHỞI ĐỘNG TRANG MỚI

    URL mới -> HTML mới.
    app.js mới -> CSS mới.
    MP4 nhận URL mới.
  */

  log(
    'HARD RESET',
    'navigate clean'
  );

  clearTimeout(watchdog);

  location.replace(
    cleanURL.href
  );
}

/* ============================
   BUTTON EVENTS
============================ */

reset.addEventListener(
  'click',
  hardReset
);

toggle.addEventListener(
  'click',
  () => {
    expanded
      ? hideDebug()
      : openDebug();
  }
);

close.addEventListener(
  'click',
  hideDebug
);

reload.addEventListener(
  'click',
  () => {
    reloadPage('manual');
  }
);

copy.addEventListener(
  'click',
  async () => {
    const content = snapshot();

    try {
      await navigator.clipboard.writeText(
        content
      );

      copy.textContent = 'Đã copy';

    } catch {
      pre.textContent = content;

      const range =
        document.createRange();

      range.selectNodeContents(
        pre
      );

      const selection =
        getSelection();

      selection.removeAllRanges();
      selection.addRange(range);

      copy.textContent =
        'Chọn rồi copy';
    }
  }
);

/* ============================
   MEDIA EVENT DEBUG
============================ */

const mediaEvents = [
  'loadstart',
  'loadedmetadata',
  'loadeddata',
  'canplay',
  'play',
  'playing',
  'pause',
  'waiting',
  'stalled',
  'suspend',
  'error',
  'emptied',
  'seeked',
  'seeking',
  'ended'
];

for (const name of mediaEvents) {
  document.addEventListener(
    name,
    event => {
      const video =
        event.target;

      if (
        video?.tagName !== 'VIDEO'
      ) {
        return;
      }

      log(
        'VIDEO ' + name,

        `key=${
          video.closest(
            '.reel-panel'
          )?.dataset.key || '?'
        } ` +

        `time=${
          video.currentTime.toFixed(2)
        } ` +

        `ready=${video.readyState} ` +
        `network=${video.networkState} ` +
        `error=${
          video.error?.code ?? '-'
        }`
      );

      if (name === 'playing') {
        didStart = true;

        const splashNow =
          document.getElementById(
            'xtpBoot'
          );

        if (splashNow) {
          splashNow.style.display =
            'none';
        }
      }

      if (name === 'error') {
        openDebug();
      }
    },
    true
  );
}

window.addEventListener(
  'error',
  event => {
    log(
      'JS ERROR',
      event.message || '?'
    );

    openDebug();
  }
);

window.addEventListener(
  'unhandledrejection',
  event => {
    log(
      'PROMISE REJECT',
      event.reason?.message ||
      String(event.reason)
    );

    openDebug();
  }
);

/* ============================
   CLOCK DEBUG
============================ */

setInterval(() => {
  if (
    document.hidden ||
    resetting
  ) {
    return;
  }

  let stalled = false;

  for (const video of videos()) {
    const prev =
      playerStates.get(video) || {
        lastTime: video.currentTime,
        stuck: 0
      };

    const advance = Math.max(
      0,
      video.currentTime -
      prev.lastTime
    );

    const shouldAdvance =
      !video.paused &&
      !video.ended &&
      video.readyState >= 2 &&
      video.playbackRate > 0;

    const stuck =
      shouldAdvance &&
      advance < 0.03

        ? prev.stuck + 1

        : 0;

    playerStates.set(
      video,
      {
        lastTime: video.currentTime,
        advance,
        stuck
      }
    );

    if (stuck === 4) {
      log(
        'VIDEO CLOCK STALLED',
        video.closest(
          '.reel-panel'
        )?.dataset.key || '?'
      );

      stalled = true;
    }
  }

  if (stalled) {
    openDebug();
  }

  if (expanded) {
    renderDebug();
  }

}, 1000);

/* ============================
   SPLASH
============================ */

const splash =
  document.getElementById(
    'xtpBoot'
  );

const bootStatus =
  splash?.querySelector(
    '.boot-status'
  );

const bootButton =
  splash?.querySelector(
    '.boot-action'
  );

const empty =
  document.getElementById(
    'empty'
  );

if (empty) {
  const observer =
    new MutationObserver(() => {
      if (
        !empty.classList.contains(
          'hidden'
        ) &&
        splash
      ) {
        splash.style.display =
          'none';
      }
    });

  observer.observe(
    empty,
    {
      attributes: true,
      attributeFilter: ['class']
    }
  );
}

bootButton?.addEventListener(
  'click',
  () => {
    const video =
      videos().find(v => (
        v.closest(
          '.reel-panel'
        )?.style.transform ===
        'translateY(0%)'
      )) ||
      videos()[0];

    if (video) {
      video.play().catch(error => {
        log(
          'MANUAL PLAY REJECT',
          error?.name || error
        );

        openDebug();
      });
    }
  }
);

setTimeout(() => {
  if (
    !didStart &&
    !document.hidden &&
    !resetting
  ) {
    log(
      'STARTUP TIMEOUT',
      '15s'
    );

    if (bootButton) {
      bootButton.style.display =
        'block';
    }

    if (bootStatus) {
      bootStatus.textContent =
        'Video chưa phát. Thử chạm ' +
        'để phát hoặc dùng HARD RESET.';
    }

    openDebug();
  }
}, 15000);

/* ============================
   AUTO UPDATE
============================ */

function fingerprint(text) {
  let hash = 2166136261;

  for (
    let i = 0;
    i < text.length;
    i++
  ) {
    hash = Math.imul(
      hash ^ text.charCodeAt(i),
      16777619
    );
  }

  return (
    (hash >>> 0).toString(16) +
    ':' +
    text.length
  );
}

async function assetFingerprint(name) {
  const url = new URL(
    name,
    BASE
  );

  url.searchParams.set(
    'xtp_check',
    Date.now().toString(36)
  );

  const response = await fetch(
    url,
    { cache: 'no-store' }
  );

  if (!response.ok) {
    throw Error(
      `${name}: HTTP ${
        response.status
      }`
    );
  }

  return fingerprint(
    await response.text()
  );
}

async function checkForUpdates(reason) {
  if (
    checking ||
    resetting
  ) {
    return checking;
  }

  if (!navigator.onLine) {
    return;
  }

  checking = (async () => {
    try {
      const results =
        await Promise.all(
          ASSETS.map(
            assetFingerprint
          )
        );

      const fresh = new Map(
        ASSETS.map(
          (name, index) => [
            name,
            results[index]
          ]
        )
      );

      if (!fingerprints.size) {
        fresh.forEach(
          (value, name) => {
            fingerprints.set(
              name,
              value
            );
          }
        );

        log(
          'UPDATE BASELINE',
          'saved'
        );

        return;
      }

      const changed =
        ASSETS.filter(
          name =>
            fingerprints.get(name) !==
            fresh.get(name)
        );

      log(
        'UPDATE CHECK',
        changed.join(', ') ||
        'unchanged'
      );

      if (changed.length) {
        pendingUpdate = true;

        if (
          reason === 'resume'
        ) {
          reloadPage(
            'new release: ' +
            changed.join(',')
          );
        }
      }

    } catch (error) {
      log(
        'UPDATE ERROR',
        error.message
      );

    } finally {
      checking = null;
      lastCheck = Date.now();
    }
  })();

  return checking;
}

document.addEventListener(
  'visibilitychange',
  () => {
    log(
      'VISIBILITY',
      document.visibilityState
    );

    if (document.hidden) {
      seenHidden = true;
      return;
    }

    if (seenHidden) {
      seenHidden = false;

      Promise.resolve(
        checkForUpdates(
          'resume'
        )
      ).then(() => {
        if (pendingUpdate) {
          reloadPage(
            'pending release'
          );
        }
      });
    }
  }
);

window.addEventListener(
  'pageshow',
  event => {
    log(
      'PAGESHOW',
      event.persisted
        ? 'bfcache'
        : 'new'
    );

    if (event.persisted) {
      checkForUpdates(
        'resume'
      );
    }
  }
);

setInterval(() => {
  if (
    !document.hidden &&
    Date.now() - lastCheck >=
      300000
  ) {
    checkForUpdates(
      'foreground'
    );
  }
}, 300000);

/* ============================
   LOAD APP
============================ */

log(
  'APP JS',
  'loading fresh app.js'
);

if (bootStatus) {
  bootStatus.textContent =
    'Đang tải app và thư viện video...';
}

const appScript =
  document.createElement(
    'script'
  );

appScript.src =
  new URL(
    'app.js?boot=' + BOOT_ID,
    BASE
  ).href;

appScript.onload = () => {
  log(
    'APP JS',
    'loaded'
  );

  checkForUpdates(
    'initial'
  );
};

appScript.onerror = () => {
  log(
    'APP JS ERROR',
    appScript.src
  );

  openDebug();

  if (bootButton) {
    bootButton.style.display =
      'block';
  }
};

document.body.appendChild(
  appScript
);

})();
</script>

</body>
</html>
