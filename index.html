
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="XTP JP - học tiếng Nhật qua video">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<title>XTP JP · Menu</title>

<style>
:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, sans-serif;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  background: #080f13;
  color: #edf8f8;
}

body {
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 24px 18px env(safe-area-inset-bottom,18px);
}

main {
  width: min(100%,410px);
  text-align: center;
}

.mark {
  width: 90px;
  height: 90px;
  border-radius: 25px;
  display: grid;
  place-items: center;
  margin: 0 auto 21px;
  background: #5de3ca;
  color: #09251f;
  font-size: 54px;
  font-weight: 950;
  box-shadow: 0 15px 60px #36c9ab35;
}

h1 {
  font-size: 35px;
  letter-spacing: -1.2px;
  margin: 0;
}

h1 span {
  color: #5de3ca;
}

.tag {
  margin: 12px 0 36px;
  font-size: 14px;
  color: #b0c0c3;
  line-height: 1.6;
}

.start {
  display: block;
  width: 100%;
  border: 0;
  border-radius: 17px;
  background: #5de3ca;
  color: #082720;
  padding: 17px;
  font-size: 17px;
  font-weight: 850;
  cursor: pointer;
}

.start:disabled {
  opacity: .65;
}

.meta {
  margin-top: 17px;
  font-size: 12px;
  color: #82999a;
  line-height: 1.6;
}

.status {
  min-height: 24px;
  margin-top: 24px;
  font-size: 13px;
  color: #9eb2b5;
}

hr {
  border: 0;
  border-top: 1px solid #203336;
  margin: 32px 0 19px;
}

.small {
  font-size: 12px;
  line-height: 1.7;
  color: #7f969b;
}
</style>
</head>

<body>
<main>
  <div class="mark">X</div>

  <h1>XTP <span>JP</span></h1>

  <p class="tag">
    Học tiếng Nhật qua video ngắn.
    Chọn bắt đầu để mở trình xem reels.
  </p>

  <button
    id="start"
    class="start"
    type="button">
    ▶ VÀO HỌC
  </button>

  <div
    id="status"
    class="status"
    role="status">
    Menu đã sẵn sàng
  </div>

  <p class="meta">
    Video và trình phát chưa được tải trong menu.
  </p>

  <hr>

  <p class="small">
    Scene 1 · Menu → Scene 2 · Player
    Chung một PWA · Giữ nguyên video đã lưu và Follow
  </p>
</main>

<script>
(() => {
  'use strict';

  const start = document.getElementById('start');
  const status = document.getElementById('status');

  let navigating = false;

  function enter() {
    if (navigating) return;

    navigating = true;

    start.disabled = true;
    start.textContent = 'ĐANG MỞ PLAYER…';

    status.textContent =
      'Đang tạo phiên xem mới…';

    const token =
      Date.now().toString(36) +
      '-' +
      Math.random().toString(36).slice(2);

    try {
      sessionStorage.setItem(
        'xtp.scene.ticket',
        token
      );
    } catch {}

    const url = new URL(
      './player.html',
      location.href
    );

    url.searchParams.set(
      'ticket',
      token
    );

    location.assign(url.href);
  }

  start.addEventListener('click', enter);

  window.addEventListener('pageshow', () => {
    navigating = false;
    start.disabled = false;

    start.textContent = '▶ VÀO HỌC';

    status.textContent = navigator.onLine
      ? 'Menu đã sẵn sàng'
      : 'Đang ngoại tuyến: cần kết nối để xem video';
  });

  window.addEventListener('online', () => {
    status.textContent =
      'Menu đã sẵn sàng';
  });

  window.addEventListener('offline', () => {
    status.textContent =
      'Đang ngoại tuyến: cần kết nối để xem video';
  });

})();
</script>
</body>
</html>
