
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<meta name="description" content="XTP JP - học tiếng Nhật qua video">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<script>
  const xtpCss = document.createElement('link');
  xtpCss.rel = 'stylesheet';
  xtpCss.href = './app.css?boot=' + Date.now().toString(36);
  document.head.appendChild(xtpCss);
</script>

<style>
#xtpBoot {
 position:fixed;z-index:9999;inset:0;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 33%,#15302f 0%,#080d10 53%,#050608 100%);
 color:white;font:inherit
}
#xtpBoot .boot-inner {
 width:min(330px,85vw);text-align:center;padding:22px
}
#xtpBoot .boot-symbol {
 display:grid;place-items:center;margin:0 auto 19px;
 width:76px;height:76px;border-radius:22px;
 background:#56d9c1;color:#0a1717;font-size:47px;font-weight:950
}
#xtpBoot .boot-title {font-size:27px;font-weight:900}
#xtpBoot .boot-title span {color:#56d9c1}
#xtpBoot .boot-status {
 margin:20px auto 10px;min-height:42px;line-height:1.5;
 font-size:13px;color:#bfc9cf
}
#xtpBoot .boot-dots {
 display:flex;justify-content:center;gap:7px;
 height:14px;margin:0 auto 23px
}
#xtpBoot .boot-dots i {
 width:6px;height:6px;border-radius:50%;
 background:#56d9c1;animation:xtpPulse 1s infinite
}
#xtpBoot .boot-dots i:nth-child(2){animation-delay:.17s}
#xtpBoot .boot-dots i:nth-child(3){animation-delay:.34s}
@keyframes xtpPulse {
 0%,60%,100%{opacity:.25;transform:scale(.7)}
 30%{opacity:1;transform:scale(1.2)}
}
#xtpBoot .boot-action {
 display:none;border:0;border-radius:14px;
 background:#56d9c1;color:#09201c;
 font-size:15px;font-weight:800;
 padding:14px 23px;min-height:48px;margin:0 auto
}
#xtpBoot .boot-small {
 font-size:11px;color:#859a9b;margin-top:18px
}
#xtpDebugToggle {
 position:fixed;z-index:10012;right:9px;
 top:calc(env(safe-area-inset-top,0px) + 7px);
 background:#17574d;color:white;border:1px solid #5cddc2;
 border-radius:10px;padding:8px;font:700 12px system-ui,sans-serif
}
#xtpDebugPane {
 display:none;position:fixed;z-index:10013;
 right:7px;top:calc(env(safe-area-inset-top,0px) + 47px);
 width:min(94vw,440px);max-height:72dvh;
 overflow:auto;padding:11px;box-sizing:border-box;
 color:#e1fff9;background:#071d20;
 border:1px solid #5cddc2;border-radius:12px;
 box-shadow:0 7px 32px #000b
}
#xtpDebugPane .debug-actions {
 display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px
}
#xtpDebugPane button {
 background:#266359;border:0;border-radius:8px;
 color:#fff;padding:9px;font:12px system-ui,sans-serif
}
#xtpDebugPane pre {
 color:#d3f5eb;white-space:pre-wrap;overflow-wrap:anywhere;
 user-select:text;-webkit-user-select:text;
 font:11px/1.45 ui-monospace,monospace;text-align:left;margin:0
}
</style>
<title>XTP JP · Video học tiếng Nhật</title>
</head>

<body>

<div id="xtpBoot">
 <div class="boot-inner">
  <div class="boot-symbol">X</div>
  <div class="boot-title">XTP <span>JP</span></div>
  <p class="boot-status" role="status">Đang khởi động…</p>
  <div class="boot-dots"><i></i><i></i><i></i></div>
  <button class="boot-action" type="button">▶ Chạm để phát</button>
  <p class="boot-small">v13.9 · Auto-update + Debug</p>
 </div>
</div>

<div id="phone" class="phone">
 <main id="stage" class="stage" aria-label="Video reels">
  <div id="panels" class="panels"></div>
  <div class="video-shade"></div>
  <div id="gesture" class="gesture"></div>

  <header class="topbar">
   <div class="brand">
    <span class="brand-mark">X</span>
    XTP <span class="mint">JP</span>
   </div>
   <div class="top-tabs">
    <button class="tab active" id="allTab" type="button">Dành cho bạn</button>
    <button class="tab" id="savedTab" type="button">Đã lưu</button>
   </div>
   <button id="libraryBtn" class="icon-btn" type="button">▦</button>
  </header>

  <div id="loadingIndicator" class="loading-status hidden">
   Đang chuẩn bị video…
  </div>

  <div id="notice" class="notice hidden" role="alert">
   <div id="noticeText"></div>
   <button id="noticeRetry" class="notice-btn" type="button">Thử lại</button>
  </div>

  <div id="empty" class="empty hidden">
   <div class="empty-logo">▶</div>
   <h1 id="emptyTitle">Chưa có video</h1>
   <p id="emptyText"></p>
   <button id="emptyRefresh" class="primary" type="button">
    Tải lại thư viện
   </button>
  </div>

  <section id="reelOverlay" class="reel-overlay hidden">
   <div class="channel-row">
    <div class="channel-main">
     <span class="channel-avatar">日</span>
     <div class="channel-meta">
      <span id="channelName" class="channel-name">XTP JP</span>
      <span id="clipTitle" class="clip-title"></span>
     </div>
    </div>
    <button id="followBtn" class="follow-btn" type="button">Follow</button>
   </div>

   <button id="caption" class="caption" type="button">
    <span id="captionTag" class="caption-tag">VI</span>
    <span id="captionBody" class="caption-body">...</span>
    <span id="captionHint" class="caption-hint">Chạm để xem 日本語</span>
   </button>

   <div class="actions">
    <button id="replayBtn" class="action" type="button">
     <span class="action-icon">↺</span><span>Phát lại</span>
    </button>
    <button id="saveBtn" class="action" type="button">
     <span id="saveIcon" class="action-icon">♡</span>
     <span id="saveText">Lưu</span>
    </button>
    <button id="speedBtn" class="action" type="button">
     <span id="speedIcon" class="action-icon speed-icon">1×</span>
     <span>Tốc độ</span>
    </button>
    <button id="soundBtn" class="action" type="button">
     <span id="soundIcon" class="action-icon">♪</span>
     <span id="soundText">Bật tiếng</span>
    </button>
   </div>

   <div class="bottom-row">
    <span id="reelCount">1 / 1</span>
    <span id="timeLabel">00:00 / 00:00</span>
   </div>

   <div id="progressTrack" class="progress-track"
        role="slider" tabindex="0"
        aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div id="focusBand" class="focus-band hidden"></div>
    <div id="progressFill" class="progress-fill"></div>
    <div id="progressThumb" class="progress-thumb"></div>
   </div>
  </section>

  <div id="tapPlay" class="tap-play hidden">
   <button id="tapPlayBtn" type="button">▶ Phát video</button>
  </div>
 </main>

 <div id="toast" class="toast hidden"></div>

 <section id="library" class="library hidden">
  <div class="library-head">
   <div>
    <h2>Thư viện video</h2>
    <p id="librarySummary">Cloudflare R2</p>
   </div>
   <button id="libraryClose" class="close-btn" type="button">✕</button>
  </div>
  <div class="library-actions">
   <input id="searchInput" type="search" placeholder="Tìm video...">
   <button id="refreshBtn" type="button">Làm mới</button>
  </div>
  <div id="libraryList" class="library-list"></div>
  <p class="library-foot">
   Video được quản lý trên Cloudflare R2.
  </p>
 </section>
</div>

<script>
(() => {
'use strict';

const VERSION = '13.9';
const BOOT_ID = Date.now().toString(36);
const BASE = new URL('./', location.href);
const ASSETS = ['index.html', 'app.js', 'app.css'];

const logs = [];
const fingerprints = new Map();
const playerStates = new WeakMap();

let previous = '';
let expanded = false;
let pendingUpdate = false;
let checking = null;
let seenHidden = false;
let didStart = false;
let lastCheck = 0;
let reloading = false;

try {
 previous = sessionStorage.getItem('xtp_debug_previous') || '';
} catch {}

const toggle = document.createElement('button');
toggle.id = 'xtpDebugToggle';
toggle.type = 'button';
toggle.textContent = 'DBG 13.9';

const panel = document.createElement('div');
panel.id = 'xtpDebugPane';

const buttons = document.createElement('div');
buttons.className = 'debug-actions';

const close = document.createElement('button');
close.textContent = 'Đóng';

const copy = document.createElement('button');
copy.textContent = 'Copy log';

const reload = document.createElement('button');
reload.textContent = 'Tải mới';

const pre = document.createElement('pre');

buttons.append(close, copy, reload);
panel.append(buttons, pre);
document.body.append(toggle, panel);

function log(event, detail = '') {
 const msg =
  new Date().toLocaleTimeString('vi-VN', {hour12:false}) +
  ' ' + event +
  (detail ? ' ' + String(detail) : '');

 logs.push(msg);
 if (logs.length > 90) logs.shift();

 if (expanded) renderDebug();
}

function allVideos() {
 return Array.from(document.querySelectorAll('video'));
}

function stateString(v, index) {
 const parent = v.closest('.reel-panel');
 const key = parent?.dataset.key || '?';
 const transform = parent?.style.transform || '?';
 const st = playerStates.get(v) || {};

 let buffered = '-';

 try {
  if (v.buffered.length) {
   buffered =
    v.buffered.start(0).toFixed(1) + '-' +
    v.buffered.end(v.buffered.length - 1).toFixed(1);
  }
 } catch {}

 return (
  `[${index}] key=${key} panel=${transform}\n` +
  `paused=${v.paused} ready=${v.readyState} network=${v.networkState}\n` +
  `time=${v.currentTime.toFixed(2)} ` +
  `duration=${Number.isFinite(v.duration) ? v.duration.toFixed(2) : '?'}\n` +
  `advance=${(st.advance || 0).toFixed(2)}s/1s ` +
  `stuck=${st.stuck || 0}s\n` +
  `buffered=${buffered} error=${v.error?.code ?? '-'}\n` +
  `src=${v.currentSrc || v.getAttribute('src') || '-'}`
 );
}

function snapshot() {
 const videos = allVideos();

 return (
  `XTP JP ${VERSION} boot=${BOOT_ID}\n` +
  `mode=${matchMedia('(display-mode:standalone)').matches ? 'PWA' : 'Browser'}\n` +
  `online=${navigator.onLine} visible=${document.visibilityState}\n` +
  `SW=${navigator.serviceWorker?.controller?.scriptURL || 'none'}\n` +
  `updates=${pendingUpdate ? 'pending' : 'current'}\n` +
  `videoCount=${videos.length}\n\n` +
  videos.map(stateString).join('\n\n') +
  '\n\n--- LOG ---\n' +
  (previous ? 'PREVIOUS SESSION:\n' + previous + '\n------------\n' : '') +
  logs.join('\n')
 );
}

function renderDebug() {
 if (expanded) pre.textContent = snapshot();
}

function openDebug() {
 expanded = true;
 panel.style.display = 'block';
 renderDebug();
}

function hideDebug() {
 expanded = false;
 panel.style.display = 'none';
}

function forceReload(reason) {
 if (reloading) return;
 reloading = true;

 log('RELOAD', reason);

 try {
  sessionStorage.setItem(
   'xtp_debug_previous',
   logs.slice(-22).join('\n')
  );
 } catch {}

 const url = new URL(location.href);

 url.searchParams.set(
  'xtp_reload',
  Date.now().toString(36)
 );

 location.replace(url.toString());
}

toggle.addEventListener('click', () => {
 expanded ? hideDebug() : openDebug();
});

close.addEventListener('click', hideDebug);

reload.addEventListener('click', () => {
 forceReload('manual');
});

copy.addEventListener('click', async () => {
 const data = snapshot();

 try {
  await navigator.clipboard.writeText(data);
  copy.textContent = 'Đã copy';
 } catch {
  pre.textContent = data;
  const range = document.createRange();
  range.selectNodeContents(pre);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  copy.textContent = 'Chọn & copy';
 }
});

// Monitor each native video element.
const mediaEvents = [
 'loadstart', 'loadedmetadata', 'loadeddata',
 'canplay', 'play', 'playing', 'pause',
 'waiting', 'stalled', 'suspend',
 'error', 'emptied', 'seeked', 'seeking', 'ended'
];

for (const eventName of mediaEvents) {
 document.addEventListener(eventName, event => {
  const v = event.target;

  if (v?.tagName !== 'VIDEO') return;

  const key = v.closest('.reel-panel')?.dataset.key || '?';

  log(
   'VIDEO ' + eventName,
   `key=${key} time=${v.currentTime.toFixed(2)} ` +
   `ready=${v.readyState} network=${v.networkState} ` +
   `error=${v.error?.code ?? '-'}`
  );

  if (eventName === 'playing') {
   didStart = true;

   const splash = document.getElementById('xtpBoot');
   if (splash) splash.style.display = 'none';
  }

  if (eventName === 'error') openDebug();
 }, true);
}

window.addEventListener('error', event => {
 log('JS ERROR', event.message || '?');
 openDebug();
});

window.addEventListener('unhandledrejection', event => {
 log(
  'PROMISE REJECT',
  event.reason?.message || String(event.reason)
 );
 openDebug();
});

// Measure actual playback clock movement.
setInterval(() => {
 if (document.hidden) return;

 let foundStuck = false;

 for (const v of allVideos()) {
  const prior = playerStates.get(v) || {
   lastTime: v.currentTime,
   stuck: 0
  };

  const advance = Math.max(
   0,
   v.currentTime - prior.lastTime
  );

  const shouldAdvance =
   !v.paused &&
   !v.ended &&
   v.readyState >= 2 &&
   v.playbackRate > 0;

  const stuck =
   shouldAdvance && advance < 0.03
    ? prior.stuck + 1
    : 0;

  playerStates.set(v, {
   lastTime: v.currentTime,
   advance,
   stuck
  });

  if (stuck === 4) {
   log(
    'VIDEO CLOCK STALLED',
    `key=${v.closest('.reel-panel')?.dataset.key || '?'} ` +
    `time=${v.currentTime}`
   );

   foundStuck = true;
  }
 }

 if (foundStuck) openDebug();
 if (expanded) renderDebug();
}, 1000);

// Initial splash handling.
const splash = document.getElementById('xtpBoot');
const bootStatus = splash?.querySelector('.boot-status');
const bootButton = splash?.querySelector('.boot-action');

const empty = document.getElementById('empty');

if (empty) {
 const observer = new MutationObserver(() => {
  if (!empty.classList.contains('hidden') && splash) {
   splash.style.display = 'none';
  }
 });

 observer.observe(empty, {
  attributes: true,
  attributeFilter: ['class']
 });
}

bootButton?.addEventListener('click', () => {
 const videos = allVideos();

 const v =
  videos.find(video =>
   video.closest('.reel-panel')?.style.transform === 'translateY(0%)'
  ) || videos[0];

 if (v) {
  v.play().catch(error => {
   log('MANUAL PLAY REJECT', error?.name || String(error));
   openDebug();
  });
 }
});

setTimeout(() => {
 if (!didStart && !document.hidden) {
  log('STARTUP TIMEOUT', '15 seconds');

  if (bootButton) bootButton.style.display = 'block';

  if (bootStatus) {
   bootStatus.textContent =
    'Video chưa phát. Chạm để thử lại hoặc mở DBG.';
  }

  openDebug();
 }
}, 15000);

// Automatic update detection.
function fingerprintText(text) {
 let hash = 2166136261;

 for (let i = 0; i < text.length; i++) {
  hash = Math.imul(
   hash ^ text.charCodeAt(i),
   16777619
  );
 }

 return (hash >>> 0).toString(16) + ':' + text.length;
}

async function assetFingerprint(name) {
 const url = new URL(name, BASE);

 url.searchParams.set(
  'xtp_check',
  Date.now().toString(36)
 );

 const response = await fetch(url, {
  cache: 'no-store'
 });

 if (!response.ok) {
  throw new Error(`${name}: HTTP ${response.status}`);
 }

 return fingerprintText(await response.text());
}

async function checkForUpdates(reason) {
 if (checking) return checking;
 if (!navigator.onLine) return;

 checking = (async () => {
  try {
   const values = await Promise.all(
    ASSETS.map(assetFingerprint)
   );

   const fresh = new Map(
    ASSETS.map((name, index) => [
     name,
     values[index]
    ])
   );

   if (!fingerprints.size) {
    fresh.forEach((value, name) => {
     fingerprints.set(name, value);
    });

    log('UPDATE BASELINE', 'saved');
    return;
   }

   const changed = ASSETS.filter(name =>
    fingerprints.get(name) !== fresh.get(name)
   );

   log(
    'UPDATE CHECK',
    changed.length ? changed.join(', ') : 'unchanged'
   );

   if (changed.length) {
    pendingUpdate = true;

    if (reason === 'resume') {
     forceReload('new release: ' + changed.join(','));
    }
   }
  } catch (error) {
   log('UPDATE ERROR', error.message || String(error));
  } finally {
   checking = null;
   lastCheck = Date.now();
  }
 })();

 return checking;
}

// Check on app resume, but do not reload if code is unchanged.
document.addEventListener('visibilitychange', () => {
 log('VISIBILITY', document.visibilityState);

 if (document.hidden) {
  seenHidden = true;
  return;
 }

 if (seenHidden) {
  seenHidden = false;

  Promise.resolve(checkForUpdates('resume')).then(() => {
   if (pendingUpdate) {
    forceReload('pending release');
   }
  });
 }
});

window.addEventListener('pageshow', event => {
 log('PAGESHOW', event.persisted ? 'bfcache' : 'new');

 if (event.persisted) {
  Promise.resolve(checkForUpdates('resume')).then(() => {
   if (pendingUpdate) {
    forceReload('bfcache update');
   }
  });
 }
});

// Foreground checking every five minutes.
// Never interrupt an active reel merely because an update exists.
setInterval(() => {
 if (
  !document.hidden &&
  Date.now() - lastCheck >= 300000
 ) {
  checkForUpdates('foreground');
 }
}, 300000);

// Load app.js freshly on each document launch.
log('APP JS', 'loading fresh app.js');

if (bootStatus) {
 bootStatus.textContent = 'Đang tải app và thư viện video...';
}

const appScript = document.createElement('script');

appScript.src = new URL(
 'app.js?boot=' + BOOT_ID,
 BASE
).href;

appScript.onload = () => {
 log('APP JS', 'loaded');
 checkForUpdates('initial');
};

appScript.onerror = () => {
 log('APP JS ERROR', 'failed to load');
 openDebug();

 if (bootButton) {
  bootButton.style.display = 'block';
 }
};

document.body.appendChild(appScript);

})();
</script>

</body>
</html>
